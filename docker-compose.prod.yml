version: "3.8"

networks:
  semesta-i-prod:

services:
  nginx_semesta_prod:
    image: nginx:stable
    container_name: semesta_nginx_prod
    restart: unless-stopped
    ports:
      - "8001:80"
    links:
      - semesta_prod
    volumes:
      - ./docker/nginx/site-prod.conf:/etc/nginx/conf.d/default.conf:rw
      - ./docker/logs/nginx:/var/logs/nginx:rw
    depends_on:
      - semesta_prod
    networks:
      - semesta-i-prod
  semesta_prod:
    build:
      context: .
    container_name: semesta_prod
    env_file: .env
    networks:
      - semesta-i-prod
